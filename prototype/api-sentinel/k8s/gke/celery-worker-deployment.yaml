apiVersion: apps/v1
kind: Deployment

metadata:
  name: celery-worker
  namespace: api-sentinel

spec:
  replicas: 1

  selector:
    matchLabels:
      app: celery-worker

  template:
    metadata:
      labels:
        app: celery-worker

    spec:
      containers:
        - name: celery-worker

          image: asia-south1-docker.pkg.dev/api-sentinel-513811/api-sentinel/api-sentinel-worker:gke-v2

          imagePullPolicy: Always

          command:
            - celery

          args:
            - -A
            - app.database:app
            - worker
            - --loglevel=INFO

          env:
            - name: postgresql_db_password
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD

            - name: API_Sentinel_Alert
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: API_Sentinel_Alert