apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-sentinel-api
  namespace: api-sentinel

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-sentinel-api

  template:
    metadata:
      labels:
        app: api-sentinel-api

    spec:
      containers:
        - name: api-sentinel-api

          image: asia-south1-docker.pkg.dev/api-sentinel-513811/api-sentinel/api-sentinel-api:gke-v1

          ports:
            - containerPort: 8000
              protocol: TCP

          readinessProbe:
            httpGet: 
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
 
          env:
            - name: postgresql_db_password
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
                    
            - name: API_Sentinel_Alert
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: API_Sentinel_Alert        
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
                  