apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beats 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beats
  template:
    metadata:
      labels:
        app: celery-beats
    spec:
      containers:
        - name: celery-beats
          image: api-sentinel-beat:fix-historical-call   
          imagePullPolicy: IfNotPresent
          command:
            - celery
          args:
            - -A
            - app.database:app
            - beat
            - --loglevel=INFO
          env:
            - name: postgresql_db_password
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD

            - name: API_Sentinel_Alert
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: API_Sentinel_Alert               
